name: Set up pinned build dependencies
description: Prepare the fixed source dependencies and Zig toolchain for Linux verification.
inputs:
  dependency-token:
    description: Token used to read the pinned dependency repositories.
    required: true
runs:
  using: composite
  steps:
    - name: Checkout pinned vail
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: passchaos/vail
        ref: 3b772b0cccb64d84fbc760df6428bc51e0fe0761
        token: ${{ inputs.dependency-token }}
        path: vail
        persist-credentials: false

    - name: Checkout pinned vort
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: passchaos/vort
        ref: a48e1151872a30a574363e994ec312969b3c7818
        token: ${{ inputs.dependency-token }}
        path: vort
        persist-credentials: false

    - name: Checkout pinned pbz
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: passchaos/pbz
        ref: 6513ef1f8b130b308bd86ba0bd02f6acc2be64e8
        path: pbz
        persist-credentials: false

    - name: Checkout pinned kron
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: passchaos/kron
        ref: 77b9572a0256da0ece836c6b49024b3282bd1d5b
        token: ${{ inputs.dependency-token }}
        path: kron
        persist-credentials: false

    - name: Checkout pinned webpkiz
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: passchaos/webpkiz
        ref: 35c9f4bfecb51a7794670d474c01b3c6fe541e9e
        token: ${{ inputs.dependency-token }}
        path: webpkiz
        persist-credentials: false

    - name: Checkout pinned regexz
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: passchaos/regexz
        ref: f150767088ef11fb4435f3b42c99165333b6e51c
        token: ${{ inputs.dependency-token }}
        path: regexz
        persist-credentials: false

    - name: Checkout pinned harnessz
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: passchaos/harnessz
        ref: e626f26b0a7ead0377254ed3a04b43b25fb2d270
        token: ${{ inputs.dependency-token }}
        path: harnessz
        persist-credentials: false

    - name: Install Zig 0.16.0
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
      with:
        version: 0.16.0

    - name: Cache Zig downloads
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cache/zig
        key: ${{ runner.os }}-zig-0.16-${{ hashFiles('netz/build.zig.zon', 'vail/build.zig.zon', 'vort/build.zig.zon', 'pbz/build.zig.zon', 'kron/build.zig.zon', 'webpkiz/build.zig.zon', 'regexz/build.zig.zon', 'harnessz/build.zig.zon') }}
        restore-keys: |
          ${{ runner.os }}-zig-0.16-

