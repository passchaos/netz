name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      fuzz_runs:
        description: Coverage-guided runs per fuzz target
        required: false
        default: "10000"

permissions:
  contents: read

concurrency:
  group: netz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: netz
    steps:
      - name: Checkout netz
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: netz
          persist-credentials: false

      - name: Require sibling dependency credentials
        env:
          DEPENDENCIES_TOKEN: ${{ secrets.NETZ_DEPENDENCIES_TOKEN }}
        run: |
          if [ -z "$DEPENDENCIES_TOKEN" ]; then
            echo "::error::Configure NETZ_DEPENDENCIES_TOKEN with read access to passchaos/vail and passchaos/vort"
            exit 1
          fi

      - name: Checkout pinned vail
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/vail
          ref: 0199eb833833fa51819c747ba01e4b5850bb0d2b
          token: ${{ secrets.NETZ_DEPENDENCIES_TOKEN }}
          path: vail
          persist-credentials: false

      - name: Checkout pinned vort
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/vort
          ref: b661c887e21fb1965db358bc6d12ea379d20178d
          token: ${{ secrets.NETZ_DEPENDENCIES_TOKEN }}
          path: vort
          persist-credentials: false

      - name: Checkout pinned pbz
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/pbz
          ref: 6513ef1f8b130b308bd86ba0bd02f6acc2be64e8
          path: pbz
          persist-credentials: false

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - name: Cache Zig downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-0.16-${{ hashFiles('netz/build.zig.zon', 'vail/build.zig.zon', 'vort/build.zig.zon', 'pbz/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-0.16-

      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src test examples benchmarks tools

      - name: Verify standalone source release
        run: zig build verify-release-source

      - name: Replay bounded fuzz corpora
        run: zig build fuzz-parsers fuzz-stateful fuzz-http-content-coding fuzz-http1-connection fuzz-http1-tls-connection fuzz-http2-connection fuzz-http2-tls-connection fuzz-http3-connection fuzz-webtransport-endpoint fuzz-mqtt-live-broker fuzz-mqtt-tls-live-broker fuzz-mqtt-reconnect fuzz-mqtt-tls-reconnect fuzz-mqtt-wss-reconnect fuzz-mqtt-bridge fuzz-mqtt-tls-bridge fuzz-mqtt-bridge-qos2 fuzz-mqtt-tls-bridge-qos2 fuzz-mqtt-outbound-bridge fuzz-mqtt-tls-outbound-bridge fuzz-mqtt-outbound-bridge-qos2 fuzz-mqtt-tls-outbound-bridge-qos2 fuzz-websocket-compression fuzz-websocket-context fuzz-websocket-h1-context fuzz-websocket-h1-tls-context fuzz-websocket-h2-context fuzz-websocket-h2-tls-context fuzz-websocket-h3-context fuzz-quic-wire fuzz-quic-protection fuzz-quic-connection fuzz-quic-path fuzz-quic-handshake fuzz-quic-endpoint

      - name: Run bounded QUIC endpoint soak
        run: zig build test-quic-endpoint-soak --summary all

      - name: Run the complete test gate serially
        run: zig build test -j1 --summary all

  portable:
    if: github.event_name != 'schedule'
    name: Cross-compile ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-gnu
          - x86_64-linux-gnu
          - x86_64-windows-gnu
          - aarch64-macos-none
          - x86_64-macos-none
    defaults:
      run:
        working-directory: netz
    steps:
      - name: Checkout netz
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: netz
          persist-credentials: false

      - name: Require sibling dependency credentials
        env:
          DEPENDENCIES_TOKEN: ${{ secrets.NETZ_DEPENDENCIES_TOKEN }}
        run: |
          if [ -z "$DEPENDENCIES_TOKEN" ]; then
            echo "::error::Configure NETZ_DEPENDENCIES_TOKEN with read access to passchaos/vail and passchaos/vort"
            exit 1
          fi

      - name: Checkout pinned vail
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/vail
          ref: 0199eb833833fa51819c747ba01e4b5850bb0d2b
          token: ${{ secrets.NETZ_DEPENDENCIES_TOKEN }}
          path: vail
          persist-credentials: false

      - name: Checkout pinned vort
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/vort
          ref: b661c887e21fb1965db358bc6d12ea379d20178d
          token: ${{ secrets.NETZ_DEPENDENCIES_TOKEN }}
          path: vort
          persist-credentials: false

      - name: Checkout pinned pbz
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/pbz
          ref: 6513ef1f8b130b308bd86ba0bd02f6acc2be64e8
          path: pbz
          persist-credentials: false

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - name: Cache Zig downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-0.16-${{ matrix.target }}-${{ hashFiles('netz/build.zig.zon', 'vail/build.zig.zon', 'vort/build.zig.zon', 'pbz/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-0.16-${{ matrix.target }}-
            ${{ runner.os }}-zig-0.16-

      - name: Compile library and public-package tests
        run: zig build test-compile -j1 -Dtarget=${{ matrix.target }} --summary all

  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fuzz-parsers
            default_runs: 10000
          - target: fuzz-stateful
            default_runs: 10000
          - target: fuzz-http1-connection
            default_runs: 256
          - target: fuzz-http1-tls-connection
            default_runs: 64
          - target: fuzz-http2-connection
            default_runs: 128
          - target: fuzz-http2-tls-connection
            default_runs: 64
          - target: fuzz-http3-connection
            default_runs: 64
          - target: fuzz-webtransport-endpoint
            default_runs: 32
          - target: fuzz-mqtt-live-broker
            default_runs: 128
          - target: fuzz-mqtt-tls-live-broker
            default_runs: 32
          - target: fuzz-mqtt-reconnect
            default_runs: 128
          - target: fuzz-mqtt-tls-reconnect
            default_runs: 16
          - target: fuzz-mqtt-wss-reconnect
            default_runs: 8
          - target: fuzz-mqtt-bridge
            default_runs: 128
          - target: fuzz-mqtt-tls-bridge
            default_runs: 16
          - target: fuzz-mqtt-bridge-qos2
            default_runs: 64
          - target: fuzz-mqtt-tls-bridge-qos2
            default_runs: 8
          - target: fuzz-mqtt-outbound-bridge
            default_runs: 64
          - target: fuzz-mqtt-tls-outbound-bridge
            default_runs: 8
          - target: fuzz-mqtt-outbound-bridge-qos2
            default_runs: 32
          - target: fuzz-mqtt-tls-outbound-bridge-qos2
            default_runs: 4
          - target: fuzz-websocket-compression
            default_runs: 10000
          - target: fuzz-websocket-context
            default_runs: 10000
          - target: fuzz-websocket-h1-context
            default_runs: 256
          - target: fuzz-websocket-h1-tls-context
            default_runs: 64
          - target: fuzz-websocket-h2-context
            default_runs: 256
          - target: fuzz-websocket-h2-tls-context
            default_runs: 64
          - target: fuzz-websocket-h3-context
            default_runs: 128
          - target: fuzz-quic-wire
            default_runs: 10000
          - target: fuzz-quic-protection
            default_runs: 10000
          - target: fuzz-quic-connection
            default_runs: 10000
          - target: fuzz-quic-path
            default_runs: 256
          - target: fuzz-quic-handshake
            default_runs: 32
          - target: fuzz-quic-endpoint
            default_runs: 32
    defaults:
      run:
        working-directory: netz
    steps:
      - name: Checkout netz
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: netz
          persist-credentials: false

      - name: Require sibling dependency credentials
        env:
          DEPENDENCIES_TOKEN: ${{ secrets.NETZ_DEPENDENCIES_TOKEN }}
        run: |
          if [ -z "$DEPENDENCIES_TOKEN" ]; then
            echo "::error::Configure NETZ_DEPENDENCIES_TOKEN with read access to passchaos/vail and passchaos/vort"
            exit 1
          fi

      - name: Checkout pinned vail
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/vail
          ref: 0199eb833833fa51819c747ba01e4b5850bb0d2b
          token: ${{ secrets.NETZ_DEPENDENCIES_TOKEN }}
          path: vail
          persist-credentials: false

      - name: Checkout pinned vort
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/vort
          ref: b661c887e21fb1965db358bc6d12ea379d20178d
          token: ${{ secrets.NETZ_DEPENDENCIES_TOKEN }}
          path: vort
          persist-credentials: false

      - name: Checkout pinned pbz
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/pbz
          ref: 6513ef1f8b130b308bd86ba0bd02f6acc2be64e8
          path: pbz
          persist-credentials: false

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - name: Restore Zig downloads and fuzz corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/zig
            netz/.zig-cache/f
          key: ${{ runner.os }}-zig-0.16-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-zig-0.16-${{ matrix.target }}-

      - name: Run bounded coverage-guided fuzzing
        env:
          FUZZ_RUNS: ${{ inputs.fuzz_runs || matrix.default_runs }}
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          case "$FUZZ_RUNS" in
            ''|*[!0-9]*)
              echo "::error::fuzz_runs must be an integer"
              exit 2
              ;;
          esac
          if [ "$FUZZ_RUNS" -lt 1 ] || [ "$FUZZ_RUNS" -gt 1000000 ]; then
            echo "::error::fuzz_runs must be between 1 and 1000000"
            exit 2
          fi
          zig build "$FUZZ_TARGET" --fuzz="$FUZZ_RUNS"

      - name: Upload failure corpus
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.target }}-failure-corpus-${{ github.run_id }}
          path: |
            netz/.zig-cache/f
            netz/.zig-cache/tmp/libfuzzer.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30
