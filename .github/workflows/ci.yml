name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      fuzz_runs:
        description: Coverage-guided runs per fuzz target
        required: false
        default: "10000"

permissions:
  contents: read

concurrency:
  group: netz-${{ github.workflow }}-${{ github.ref }}${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('-{0}', github.event_name) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  preflight:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: netz
    steps:
      - name: Checkout netz
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: netz
          persist-credentials: false

      - name: Set up pinned build dependencies
        uses: ./netz/.github/actions/setup-build
        with:
          dependency-token: ${{ secrets.NETZ_DEPENDENCIES_TOKEN || github.token }}

      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon build src test examples benchmarks tools

      - name: Validate CI log helpers
        run: |
          helper_status=0
          python tools/ci/test_failure_annotations_test.py > ci-helper-tests.log 2>&1 || helper_status=$?
          python tools/ci/run_test_progress_test.py >> ci-helper-tests.log 2>&1 || helper_status=$?
          cat ci-helper-tests.log
          if [ "$helper_status" -ne 0 ]; then
            python tools/ci/test_failure_annotations.py ci-helper-tests.log
          fi
          exit "$helper_status"

      - name: Audit evidence hashes
        run: zig build verify-evidence -- --max-unresolved=24

      - name: Verify standalone source release
        run: zig build verify-release-source

      - name: Replay bounded fuzz corpora
        run: zig build test-fuzz-replay -j1 -Dtest-progress=true --summary all

      - name: Run bounded QUIC endpoint soak
        run: zig build test-quic-endpoint-soak --summary all


  complete:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: netz
    steps:
      - name: Checkout netz
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: netz
          persist-credentials: false

      - name: Set up pinned build dependencies
        uses: ./netz/.github/actions/setup-build
        with:
          dependency-token: ${{ secrets.NETZ_DEPENDENCIES_TOKEN || github.token }}

      - name: Install the pinned interop Python runner
        run: python -m pip install --disable-pip-version-check uv==0.13.0

      - name: Run the complete test gate serially
        run: |
          complete_status=0
          timeout --signal=INT --kill-after=10s 28m python tools/ci/run_test_progress.py --title "Complete test progress" --log complete-tests.log -- zig build test -j1 -Dtest-progress=true --verbose --summary all || complete_status=$?
          if [ "$complete_status" -ne 0 ]; then
            python tools/ci/test_failure_annotations.py complete-tests.log
          fi
          exit "$complete_status"

  verify:
    if: always() && github.event_name != 'schedule'
    needs: [preflight, complete]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require preflight and complete test success
        env:
          NETZ_PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          NETZ_COMPLETE_RESULT: ${{ needs.complete.result }}
        run: |
          test "$NETZ_PREFLIGHT_RESULT" = success
          test "$NETZ_COMPLETE_RESULT" = success

  portable:
    if: github.event_name != 'schedule'
    name: Portable ${{ matrix.target }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-windows-gnu
            runner: ubuntu-latest
          - target: x86_64-windows-gnu
            runner: windows-latest
    defaults:
      run:
        working-directory: netz
        shell: bash
    steps:
      - name: Checkout netz
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: netz
          persist-credentials: false

      - name: Checkout pinned vail
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/vail
          ref: 3b772b0cccb64d84fbc760df6428bc51e0fe0761
          token: ${{ secrets.NETZ_DEPENDENCIES_TOKEN || github.token }}
          path: vail
          persist-credentials: false

      - name: Checkout pinned vort
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/vort
          ref: a48e1151872a30a574363e994ec312969b3c7818
          token: ${{ secrets.NETZ_DEPENDENCIES_TOKEN || github.token }}
          path: vort
          persist-credentials: false

      - name: Checkout pinned pbz
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/pbz
          ref: 6513ef1f8b130b308bd86ba0bd02f6acc2be64e8
          path: pbz
          persist-credentials: false

      - name: Checkout pinned kron
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/kron
          ref: 77b9572a0256da0ece836c6b49024b3282bd1d5b
          token: ${{ secrets.NETZ_DEPENDENCIES_TOKEN || github.token }}
          path: kron
          persist-credentials: false

      - name: Checkout pinned webpkiz
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/webpkiz
          ref: 35c9f4bfecb51a7794670d474c01b3c6fe541e9e
          token: ${{ secrets.NETZ_DEPENDENCIES_TOKEN || github.token }}
          path: webpkiz
          persist-credentials: false

      - name: Checkout pinned regexz
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/regexz
          ref: f150767088ef11fb4435f3b42c99165333b6e51c
          token: ${{ secrets.NETZ_DEPENDENCIES_TOKEN || github.token }}
          path: regexz
          persist-credentials: false

      - name: Checkout pinned harnessz
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/harnessz
          ref: e626f26b0a7ead0377254ed3a04b43b25fb2d270
          token: ${{ secrets.NETZ_DEPENDENCIES_TOKEN || github.token }}
          path: harnessz
          persist-credentials: false

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - name: Cache Zig downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/zig' || '~/.cache/zig' }}
          key: ${{ runner.os }}-zig-0.16-${{ matrix.target }}-${{ hashFiles('netz/build.zig.zon', 'vail/build.zig.zon', 'vort/build.zig.zon', 'pbz/build.zig.zon', 'kron/build.zig.zon', 'webpkiz/build.zig.zon', 'regexz/build.zig.zon', 'harnessz/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-0.16-${{ matrix.target }}-
            ${{ runner.os }}-zig-0.16-

      - name: Compile library and public-package tests
        if: runner.os != 'Windows'
        run: zig build test-compile -j1 -Dtarget=${{ matrix.target }} --summary all

      - name: Validate native CI log helpers
        if: runner.os == 'Windows' || (runner.os == 'Linux' && matrix.target == 'x86_64-linux-gnu')
        run: |
          helper_status=0
          python tools/ci/test_failure_annotations_test.py > ci-helper-tests.log 2>&1 || helper_status=$?
          python tools/ci/run_test_progress_test.py >> ci-helper-tests.log 2>&1 || helper_status=$?
          cat ci-helper-tests.log
          if [ "$helper_status" -ne 0 ]; then
            python tools/ci/test_failure_annotations.py ci-helper-tests.log
          fi
          exit "$helper_status"

      - name: Run native Linux interface binding regressions
        if: runner.os == 'Linux' && matrix.target == 'x86_64-linux-gnu'
        run: zig build test-http test-quic -j1 -Dtarget=${{ matrix.target }} '-Dtest-filter=network interface' '-Dtest-filter=HTTP3 endpoint adoption' --summary all

      - name: Run native Linux connection and command regressions
        if: runner.os == 'Linux' && matrix.target == 'x86_64-linux-gnu'
        run: zig build test-tls test-http1 test-http2 test-http3 test-quic test-websocket -j1 -Dtarget=${{ matrix.target }} '-Dtest-filter=WebSocket named endpoint' '-Dtest-filter=WSS named endpoint' '-Dtest-filter=WSS common handshake budget' '-Dtest-filter=deadline expires after TCP connect' '-Dtest-filter=HTTP/2 h2c stream ownership' '-Dtest-filter=WSS vail TLS rejection closes' '-Dtest-filter=WSS vail TLS helper failure' '-Dtest-filter=versioned TLS establishment' '-Dtest-filter=HTTP1 named endpoint' '-Dtest-filter=HTTP1 TLS address endpoint' '-Dtest-filter=borrowed pipeline batch' '-Dtest-filter=optional write scratch compact' '-Dtest-filter=informational development sends' '-Dtest-filter=inline expired commands' '-Dtest-filter=concurrent command rechecks' '-Dtest-filter=QUIC caller batch leaves pending GRO' --summary failures

      - name: Probe native Winsock interface option semantics
        if: runner.os == 'Windows'
        run: python tools/ci/windows_interface_binding_probe.py

      - name: Run native HTTP3 resolver and acquisition regressions
        if: runner.os == 'Windows' || (runner.os == 'Linux' && matrix.target == 'x86_64-linux-gnu')
        run: |
          h3_status=0
          zig build test-http3 -j1 -Dtarget=${{ matrix.target }} '-Dtest-filter=HTTP3 system resolver' '-Dtest-filter=HTTP/3 shared synchronous acquire wakes' '-Dtest-filter=HTTP/3 shared synchronous acquire cancels' '-Dtest-filter=HTTP/3 shared acquisition deadline' '-Dtest-filter=HTTP3 connection race admission' '-Dtest-filter=HTTP3 connection race storage' '-Dtest-filter=HTTP3 connection race pool' '-Dtest-filter=HTTP3 secure entropy' '-Dtest-filter=HTTP3 Happy Eyeballs total deadline' '-Dtest-filter=HTTP3 Happy Eyeballs cancellation joins' --summary all > native-http3.log 2>&1 || h3_status=$?
          cat native-http3.log
          if [ "$h3_status" -ne 0 ]; then
            python tools/ci/test_failure_annotations.py native-http3.log
          fi
          exit "$h3_status"

      - name: Run native ordered TCP hostname regressions
        if: runner.os == 'Windows' || (runner.os == 'Linux' && matrix.target == 'x86_64-linux-gnu')
        run: |
          hostname_status=0
          zig build test-http1 -j1 -Dtarget=${{ matrix.target }} '-Dtest-filter=TCP ordered hostname' '-Dtest-filter=Windows TCP' '-Dtest-filter=Winsock connect address' '-Dtest-filter=HTTP/1 client connects by host name' --summary all > native-hostname.log 2>&1 || hostname_status=$?
          cat native-hostname.log
          if [ "$hostname_status" -ne 0 ]; then
            python tools/ci/test_failure_annotations.py native-hostname.log
          fi
          exit "$hostname_status"

      - name: Run native trust startup regressions
        if: runner.os == 'Windows' || (runner.os == 'Linux' && matrix.target == 'x86_64-linux-gnu')
        run: |
          set -o pipefail
          trust_status=0
          python tools/ci/run_test_progress.py --title "Native trust progress" --log native-trust.log -- zig build test-quic test-tls test-http test-websocket test-webtransport -j1 -Dtest-progress=true -Dtarget=${{ matrix.target }} '-Dtest-filter=trust load' '-Dtest-filter=trust startup' '-Dtest-filter=trust completion' '-Dtest-filter=QUIC trust precedence' '-Dtest-filter=QUIC client verifies' '-Dtest-filter=effective trust' '-Dtest-filter=HTTP H3 pool driver admission' '-Dtest-filter=startup entropy' '-Dtest-filter=owned deadline' '-Dtest-filter=TLS CA bundle lock' --verbose --summary all || trust_status=$?
          if [ "$trust_status" -ne 0 ]; then
            python tools/ci/test_failure_annotations.py native-trust.log
          fi
          exit "$trust_status"

      - name: Run native H1 H2 resolver and pull reader regressions
        if: runner.os == 'Windows' || (runner.os == 'Linux' && matrix.target == 'x86_64-linux-gnu')
        run: |
          resolver_status=0
          zig build test-http1 test-http2 -j1 -Dtarget=${{ matrix.target }} '-Dtest-filter=HTTP/1 pull' '-Dtest-filter=HTTP1 native resolver policy' '-Dtest-filter=HTTP2 native resolver policy' '-Dtest-filter=connection race admission' '-Dtest-filter=connection race storage' '-Dtest-filter=connection race pool' '-Dtest-filter=absolute deadline wait' '-Dtest-filter=stream timed' '-Dtest-filter=listener accept deadline' '-Dtest-filter=TCP connect deadline' --summary all > native-resolver.log 2>&1 || resolver_status=$?
          cat native-resolver.log
          if [ "$resolver_status" -ne 0 ]; then
            python tools/ci/test_failure_annotations.py native-resolver.log
          fi
          exit "$resolver_status"

      - name: Run native protocol CI regressions
        if: runner.os == 'Windows' || (runner.os == 'Linux' && matrix.target == 'x86_64-linux-gnu')
        timeout-minutes: 5
        run: |
          protocol_status=0
          python tools/ci/run_test_progress.py --title "Native protocol combined CI" --log native-protocol-ci.log -- zig build test-http2 test-webtransport -j1 -Dtest-progress=true -Dtarget=${{ matrix.target }} '-Dtest-filter=HTTP/2 connection keeps optional state compact' '-Dtest-filter=standalone dispatcher retains rejection through bounded cleanup' '-Dtest-filter=ReconnectingEndpointClient reconnects only future Sessions' --summary all || protocol_status=$?
          if [ "$protocol_status" -ne 0 ]; then
            python tools/ci/test_failure_annotations.py native-protocol-ci.log
            for protocol_case in h2-layout dispatcher-rejection endpoint-reconnect; do
              case "$protocol_case" in
                h2-layout)
                  protocol_scope=test-http2
                  protocol_filter='HTTP/2 connection keeps optional state compact'
                  ;;
                dispatcher-rejection)
                  protocol_scope=test-webtransport
                  protocol_filter='standalone dispatcher retains rejection through bounded cleanup'
                  ;;
                endpoint-reconnect)
                  protocol_scope=test-webtransport
                  protocol_filter='ReconnectingEndpointClient reconnects only future Sessions'
                  ;;
              esac
              case_status=0
              python tools/ci/run_test_progress.py --title "Native protocol CI: $protocol_case" --log "native-protocol-$protocol_case.log" -- zig build "$protocol_scope" -j1 -Dtest-progress=true -Dtarget=${{ matrix.target }} "-Dtest-filter=$protocol_filter" --summary all || case_status=$?
              if [ "$case_status" -ne 0 ]; then
                python tools/ci/test_failure_annotations.py "native-protocol-$protocol_case.log"
              fi
            done
          fi
          owned_input_status=0
          python tools/ci/run_test_progress.py --title "Native H2 batch wake and sliced command storage" --log native-h2-owned-input.log -- zig build test-http2 test-webtransport -j1 -Dtest-progress=true -Dtarget=${{ matrix.target }} '-Dtest-filter=HTTP/2 buffered frame wake' '-Dtest-filter=HTTP/2 batch cancellation' '-Dtest-filter=WebTransport HTTP2 sliced' '-Dtest-filter=WebTransport HTTP2 EndpointClient queue admission' '-Dtest-filter=WebTransport HTTP2 EndpointServer queue admission' '-Dtest-filter=WebTransport HTTP2 EndpointClient owns multiplexed Sessions' '-Dtest-filter=WebTransport HTTP2 EndpointServer owns admission Sessions' --summary all || owned_input_status=$?
          if [ "$owned_input_status" -ne 0 ]; then
            python tools/ci/test_failure_annotations.py native-h2-owned-input.log
            protocol_status=$owned_input_status
          fi
          if [ '${{ runner.os }}' = 'Windows' ]; then
            completion_status=0
            python tools/ci/run_test_progress.py --title "Native Windows TCP completion probe" --log native-windows-tcp-completion.log -- zig test tools/ci/windows_tcp_completion_probe.zig -target x86_64-windows-gnu || completion_status=$?
            if [ "$completion_status" -ne 0 ]; then
              python tools/ci/test_failure_annotations.py native-windows-tcp-completion.log
              protocol_status=$completion_status
            fi
          fi
          prefix_context_status=0
          python tools/ci/run_test_progress.py --title "Native QUIC receive prefix context" --log native-quic-prefix-context.log -- zig build test-quic -j1 -Dtest-progress=true -Dtarget=${{ matrix.target }} '-Dtest-filter=QUIC UDP batch preserves received prefix and rearms cancellation' --summary all || prefix_context_status=$?
          if [ "$prefix_context_status" -ne 0 ]; then
            python tools/ci/test_failure_annotations.py native-quic-prefix-context.log
            protocol_status=$prefix_context_status
          fi
          removal_context_status=0
          python tools/ci/run_test_progress.py --title "Native WebTransport removal deadline context" --log native-wt-removal-context.log -- zig build test-webtransport -j1 -Dtest-progress=true -Dtarget=${{ matrix.target }} '-Dtest-filter=WebTransport endpoint client removal deadline' --summary all || removal_context_status=$?
          if [ "$removal_context_status" -ne 0 ]; then
            python tools/ci/test_failure_annotations.py native-wt-removal-context.log
            protocol_status=$removal_context_status
          fi
          exit "$protocol_status"

      - name: Run native HTTP3 send deadline regressions
        if: runner.os == 'Windows' || (runner.os == 'Linux' && matrix.target == 'x86_64-linux-gnu')
        timeout-minutes: 5
        run: |
          send_deadline_status=0
          python tools/ci/run_test_progress.py --title "Native HTTP3 send deadlines" --log native-http3-send-deadlines.log -- zig build test-http3 test-quic test-webtransport -j1 -Dtest-progress=true -Dtarget=${{ matrix.target }} '-Dtest-filter=QUIC send deadline' '-Dtest-filter=HTTP/3 development socket deadline' '-Dtest-filter=HTTP/3 protected batch deadline' '-Dtest-filter=HTTP/3 concurrent command' '-Dtest-filter=HTTP/3 concurrent DATA public' '-Dtest-filter=QUIC stream socket deadline' '-Dtest-filter=QUIC datagram socket deadline' '-Dtest-filter=WebTransport STREAM socket deadline' --summary all || send_deadline_status=$?
          if [ "$send_deadline_status" -ne 0 ]; then
            python tools/ci/test_failure_annotations.py native-http3-send-deadlines.log
          fi
          fixture_status=0
          python tools/ci/run_test_progress.py --title "Native protocol I/O test contexts" --log native-protocol-test-contexts.log -- zig build test-http3 test-webtransport test-http1 test-websocket -j1 -Dtest-progress=true -Dtarget=${{ matrix.target }} '-Dtest-filter=paced push timeout retires only its streams' '-Dtest-filter=HTTP/3 protected server sends promised push response' '-Dtest-filter=HTTP/3 protected runtime streams request and response DATA chunks' '-Dtest-filter=HTTP/3 handshake client batches request DATA across streams' '-Dtest-filter=HTTP/3 protected response scheduler honors request priority' '-Dtest-filter=HTTP/3 connection control frames advance control stream offset' '-Dtest-filter=HTTP/3 protected runtime sends and accumulates RFC 9412 origins' '-Dtest-filter=HTTP/3 protected response deadlines preserve aggregate and streaming progress' '-Dtest-filter=HTTP/3 development body deadline distinguishes retry from fail close' '-Dtest-filter=HTTP/3 protected client resumes pending push cancellation after deadline' '-Dtest-filter=WebTransport send flow' '-Dtest-filter=HTTP/3 aggregate deadlines bound request and response head sends' '-Dtest-filter=HTTP/3 serveConnection shutdown deadline covers GOAWAY send' '-Dtest-filter=HTTP/3 complete response queues refused cancellation and retries before a sibling' '-Dtest-filter=finite server' '-Dtest-filter=WebTransport development close deadline fails closed after a visible prefix' --summary all || fixture_status=$?
          if [ "$fixture_status" -ne 0 ]; then
            python tools/ci/test_failure_annotations.py native-protocol-test-contexts.log
            send_deadline_status=$fixture_status
          fi
          exit "$send_deadline_status"

      - name: Run native client CA reload regression
        if: runner.os == 'Linux' && matrix.target == 'x86_64-linux-gnu'
        timeout-minutes: 5
        run: |
          ca_reload_status=0
          timeout --signal=INT --kill-after=10s 4m python tools/ci/run_test_progress.py --title "Native client CA reload progress" --log native-client-ca-reload.log -- zig build interop-mqtt-broker-config -j1 --summary all -- --only-client-ca-reload || ca_reload_status=$?
          if [ "$ca_reload_status" -ne 0 ]; then
            python tools/ci/test_failure_annotations.py native-client-ca-reload.log
          fi
          exit "$ca_reload_status"

      - name: Run native Windows transport regressions
        if: runner.os == 'Windows'
        run: |
          transport_status=0
          zig build test-http test-http3 test-quic test-websocket test-webtransport -Dtarget=${{ matrix.target }} '-Dtest-filter=peer address' '-Dtest-filter=network interface' '-Dtest-filter=HTTP3 endpoint adoption' '-Dtest-filter=HTTP/3 CONNECT DATAGRAM' '-Dtest-filter=QUIC stream receive target admission' '-Dtest-filter=HTTP/3 protected runtime rejects server-initiated bidirectional message streams' '-Dtest-filter=WebSocket stream adapter' '-Dtest-filter=WebSocket named endpoint' '-Dtest-filter=WSS named endpoint' '-Dtest-filter=WSS common handshake budget' '-Dtest-filter=deadline expires after TCP connect' '-Dtest-filter=HTTP/2 h2c stream ownership' '-Dtest-filter=WSS vail TLS rejection closes' '-Dtest-filter=WSS vail TLS helper failure' '-Dtest-filter=versioned TLS establishment' '-Dtest-filter=HTTP1 named endpoint' '-Dtest-filter=HTTP1 TLS address endpoint' '-Dtest-filter=WebTransport operation admission' '-Dtest-filter=WebTransport stream reader admission' '-Dtest-filter=WebTransport stream read buffer admission' '-Dtest-filter=WebTransport stream read target admission' '-Dtest-filter=WebTransport closed extension routing' --summary all > native-transport.log 2>&1 || transport_status=$?
          cat native-transport.log
          if [ "$transport_status" -ne 0 ]; then
            {
              echo '### Native transport test failure'
              echo '```text'
              head -n 160 native-transport.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY'
          from pathlib import Path
          lines = Path('native-transport.log').read_text(errors='replace').splitlines()
          failures = [index for index, line in enumerate(lines) if 'error:' in line]
          for index in failures[:12]:
              context = '\n'.join(lines[index:index + 14])
              message = context.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Native transport regression::' + message)
          PY
          fi
          exit "$transport_status"

  portable-macos:
    if: github.event_name != 'schedule'
    name: Cross-compile ${{ matrix.target }} (macOS SDK)
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-macos-none
          - x86_64-macos-none
    defaults:
      run:
        working-directory: netz
    steps:
      - name: Checkout netz
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: netz
          persist-credentials: false

      - name: Checkout pinned vail
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/vail
          ref: 3b772b0cccb64d84fbc760df6428bc51e0fe0761
          token: ${{ secrets.NETZ_DEPENDENCIES_TOKEN || github.token }}
          path: vail
          persist-credentials: false

      - name: Checkout pinned vort
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/vort
          ref: a48e1151872a30a574363e994ec312969b3c7818
          token: ${{ secrets.NETZ_DEPENDENCIES_TOKEN || github.token }}
          path: vort
          persist-credentials: false

      - name: Checkout pinned pbz
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/pbz
          ref: 6513ef1f8b130b308bd86ba0bd02f6acc2be64e8
          path: pbz
          persist-credentials: false

      - name: Checkout pinned kron
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/kron
          ref: 77b9572a0256da0ece836c6b49024b3282bd1d5b
          token: ${{ secrets.NETZ_DEPENDENCIES_TOKEN || github.token }}
          path: kron
          persist-credentials: false

      - name: Checkout pinned webpkiz
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/webpkiz
          ref: 35c9f4bfecb51a7794670d474c01b3c6fe541e9e
          token: ${{ secrets.NETZ_DEPENDENCIES_TOKEN || github.token }}
          path: webpkiz
          persist-credentials: false

      - name: Checkout pinned regexz
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/regexz
          ref: f150767088ef11fb4435f3b42c99165333b6e51c
          token: ${{ secrets.NETZ_DEPENDENCIES_TOKEN || github.token }}
          path: regexz
          persist-credentials: false

      - name: Checkout pinned harnessz
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/harnessz
          ref: e626f26b0a7ead0377254ed3a04b43b25fb2d270
          token: ${{ secrets.NETZ_DEPENDENCIES_TOKEN || github.token }}
          path: harnessz
          persist-credentials: false

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - name: Cache Zig downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-0.16-${{ matrix.target }}-${{ hashFiles('netz/build.zig.zon', 'vail/build.zig.zon', 'vort/build.zig.zon', 'pbz/build.zig.zon', 'kron/build.zig.zon', 'webpkiz/build.zig.zon', 'regexz/build.zig.zon', 'harnessz/build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-0.16-${{ matrix.target }}-
            ${{ runner.os }}-zig-0.16-

      - name: Compile library and public-package tests
        run: zig build test-compile -j1 -Dtarget=${{ matrix.target }} --summary all

  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fuzz-parsers
            default_runs: 10000
          - target: fuzz-stateful
            default_runs: 10000
          - target: fuzz-http1-connection
            default_runs: 256
          - target: fuzz-http1-tls-connection
            default_runs: 64
          - target: fuzz-http2-connection
            default_runs: 128
          - target: fuzz-http2-tls-connection
            default_runs: 64
          - target: fuzz-http3-connection
            default_runs: 64
          - target: fuzz-webtransport-endpoint
            default_runs: 32
          - target: fuzz-mqtt-live-broker
            default_runs: 128
          - target: fuzz-mqtt-tls-live-broker
            default_runs: 32
          - target: fuzz-mqtt-reconnect
            default_runs: 128
          - target: fuzz-mqtt-tls-reconnect
            default_runs: 16
          - target: fuzz-mqtt-wss-reconnect
            default_runs: 8
          - target: fuzz-mqtt-bridge
            default_runs: 128
          - target: fuzz-mqtt-tls-bridge
            default_runs: 16
          - target: fuzz-mqtt-bridge-qos2
            default_runs: 64
          - target: fuzz-mqtt-tls-bridge-qos2
            default_runs: 8
          - target: fuzz-mqtt-outbound-bridge
            default_runs: 64
          - target: fuzz-mqtt-tls-outbound-bridge
            default_runs: 8
          - target: fuzz-mqtt-outbound-bridge-qos2
            default_runs: 32
          - target: fuzz-mqtt-tls-outbound-bridge-qos2
            default_runs: 4
          - target: fuzz-websocket-compression
            default_runs: 10000
          - target: fuzz-websocket-context
            default_runs: 10000
          - target: fuzz-websocket-h1-context
            default_runs: 256
          - target: fuzz-websocket-h1-tls-context
            default_runs: 64
          - target: fuzz-websocket-h2-context
            default_runs: 256
          - target: fuzz-websocket-h2-tls-context
            default_runs: 64
          - target: fuzz-websocket-h3-context
            default_runs: 128
          - target: fuzz-quic-wire
            default_runs: 10000
          - target: fuzz-quic-protection
            default_runs: 10000
          - target: fuzz-quic-connection
            default_runs: 10000
          - target: fuzz-quic-path
            default_runs: 256
          - target: fuzz-quic-handshake
            default_runs: 32
          - target: fuzz-quic-endpoint
            default_runs: 32
    defaults:
      run:
        working-directory: netz
    steps:
      - name: Checkout netz
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: netz
          persist-credentials: false

      - name: Checkout pinned vail
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/vail
          ref: 3b772b0cccb64d84fbc760df6428bc51e0fe0761
          token: ${{ secrets.NETZ_DEPENDENCIES_TOKEN || github.token }}
          path: vail
          persist-credentials: false

      - name: Checkout pinned vort
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/vort
          ref: a48e1151872a30a574363e994ec312969b3c7818
          token: ${{ secrets.NETZ_DEPENDENCIES_TOKEN || github.token }}
          path: vort
          persist-credentials: false

      - name: Checkout pinned pbz
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/pbz
          ref: 6513ef1f8b130b308bd86ba0bd02f6acc2be64e8
          path: pbz
          persist-credentials: false

      - name: Checkout pinned kron
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/kron
          ref: 77b9572a0256da0ece836c6b49024b3282bd1d5b
          token: ${{ secrets.NETZ_DEPENDENCIES_TOKEN || github.token }}
          path: kron
          persist-credentials: false

      - name: Checkout pinned webpkiz
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/webpkiz
          ref: 35c9f4bfecb51a7794670d474c01b3c6fe541e9e
          token: ${{ secrets.NETZ_DEPENDENCIES_TOKEN || github.token }}
          path: webpkiz
          persist-credentials: false

      - name: Checkout pinned regexz
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/regexz
          ref: f150767088ef11fb4435f3b42c99165333b6e51c
          token: ${{ secrets.NETZ_DEPENDENCIES_TOKEN || github.token }}
          path: regexz
          persist-credentials: false

      - name: Checkout pinned harnessz
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: passchaos/harnessz
          ref: e626f26b0a7ead0377254ed3a04b43b25fb2d270
          token: ${{ secrets.NETZ_DEPENDENCIES_TOKEN || github.token }}
          path: harnessz
          persist-credentials: false

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - name: Restore Zig downloads and fuzz corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/zig
            netz/.zig-cache/f
          key: ${{ runner.os }}-zig-0.16-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-zig-0.16-${{ matrix.target }}-

      - name: Run bounded coverage-guided fuzzing
        env:
          FUZZ_RUNS: ${{ inputs.fuzz_runs || matrix.default_runs }}
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          case "$FUZZ_RUNS" in
            ''|*[!0-9]*)
              echo "::error::fuzz_runs must be an integer"
              exit 2
              ;;
          esac
          if [ "$FUZZ_RUNS" -lt 1 ] || [ "$FUZZ_RUNS" -gt 1000000 ]; then
            echo "::error::fuzz_runs must be between 1 and 1000000"
            exit 2
          fi
          zig build "$FUZZ_TARGET" --fuzz="$FUZZ_RUNS"

      - name: Upload failure corpus
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.target }}-failure-corpus-${{ github.run_id }}
          path: |
            netz/.zig-cache/f
            netz/.zig-cache/tmp/libfuzzer.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30
