[package]
name = "netz-hyper-http1-body"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "netz-hyper-http1-body"
path = "src/main.rs"

[[bin]]
name = "netz-hyper-http1-interop"
path = "src/bin/interop.rs"

[dependencies]
bytes = "1.2"
futures-core = "0.3"
http-body-util = "0.1"
hyper = { path = "../../../../Work/hyper", features = ["client", "http1", "server"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
