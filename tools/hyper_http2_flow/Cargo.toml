[package]
name = "netz-hyper-http2-flow"
version = "0.0.0"
edition = "2021"
publish = false

[features]
allocation-stats = []

[[bin]]
name = "netz-hyper-http2-interop-server"
path = "src/bin/interop_server.rs"

[[bin]]
name = "netz-hyper-http2-interop-client"
path = "src/bin/interop_client.rs"

[[bin]]
name = "netz-hyper-http-connect-proxy"
path = "src/bin/interop_proxy.rs"

[[bin]]
name = "netz-h2-push-peer"
path = "src/bin/push_peer.rs"

[[bin]]
name = "netz-hyper-http2-websocket-server"
path = "src/bin/websocket_server.rs"

[[bin]]
name = "netz-hyper-http2-websocket-bench"
path = "src/bin/websocket_bench_peer.rs"

[[bin]]
name = "netz-hyper-http2-cancel-server"
path = "src/bin/cancel_server.rs"

[[bin]]
name = "netz-hyper-http2-cancel-client"
path = "src/bin/cancel_client.rs"

[[bin]]
name = "netz-hyper-unified-server"
path = "src/bin/unified_server.rs"

[[bin]]
name = "netz-hyper-connect-udp"
path = "src/bin/connect_udp.rs"

[[bin]]
name = "netz-h2-ping-abuse-client"
path = "src/bin/ping_abuse_client.rs"

[[bin]]
name = "netz-h2-ping-throttle-server"
path = "src/bin/ping_throttle_server.rs"

[dependencies]
bytes = "1.2"
futures-util = "0.3"
getrandom = "0.2"
http-body-util = "0.1"
hyper = { path = "../../../../Work/hyper", features = ["client", "http1", "http2", "server"] }
h2 = "0.4.15"
http = "1"
pin-project-lite = "0.2"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
