[package]
name = "netz-webtransport-protocol-peer"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "=1.0.104"
bytes = "=1.12.1"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
quinn = { version = "=0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
serde_json = "1"
url = "2"
web-transport-quinn = { path = "../../../../../Work/web-transport/rs/web-transport-quinn", default-features = false, features = ["ring"] }
